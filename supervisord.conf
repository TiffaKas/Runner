[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :0 -screen 0 1280x800x16
autorestart=true

[program:openbox]
command=openbox
environment=DISPLAY=":0"
autorestart=true

[program:x11vnc]
command=x11vnc -display :0 -forever -shared -rfbport 5900 -nopw
autorestart=true

[program:novnc]
command=websockify --web=/usr/share/novnc/ 8080 localhost:5900
autorestart=true
